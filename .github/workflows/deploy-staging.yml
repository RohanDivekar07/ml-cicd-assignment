name: Deploy to Staging

on:
  push:
    tags:
      - "v*"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests before deploying
        run: pytest -v

      - name: Train model for release
        run: python -m src.train

      - name: Simulate deployment to staging
        run: |
          echo "Deploying version ${GITHUB_REF_NAME} to STAGING..."
          mkdir -p staging_release
          cp artifacts/model.joblib artifacts/metrics.json staging_release/
          echo "Deployed ${GITHUB_REF_NAME} at $(date -u)" > staging_release/DEPLOYED.txt
          ls -la staging_release

      - name: Upload staging package
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ github.ref_name }}
          path: staging_release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: staging_release/*
